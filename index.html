<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- redirects to index.html after 3 seconds -->
    <meta http-equiv="refresh" content="3;url=HTML/home.html">

    <title>Loading... | JobHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #FBF3E9;
            padding: 0 5vw;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 380px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .logo-img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }

        .logo-text {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 28px;
            font-weight: bold;
            color: #C1440E;
            line-height: 1;
        }

        h2 {
            color: #7A7267;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
        }

        .loader {
            width: 100%;
            max-width: 300px;
            height: 10px;
            background: #EAE0D2;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(to right, #C1440E, #D4A373);
            animation: load 3s linear forwards;
        }

        @keyframes load {
            from { width: 0%; }
            to { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand">
            <img src="/images/logo.png" class="logo-img" alt="JobHub Logo">
            <div class="logo-text">JobHub</div>
        </div>

        <h2>Loading...</h2>

        <div class="loader">
            <div class="progress"></div>
        </div>
    </div>

</body>
</html>
